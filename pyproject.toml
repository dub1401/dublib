[build-system]
requires = ["uv-build>=0.13,<0.14.0"]
build-backend = "uv_build"

[project]
name = "dublib"
version = "0.33.0"
description = "Коллекция полезных модулей от DUB1401."
authors = [
	{name = "DUB1401", email = "vlad.milosta@outlook.com"}
]
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
	"more-itertools",
	"orjson",
	"pyyaml",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Operating System :: OS Independent",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Documentation :: Sphinx",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Typing :: Typed"
]
[project.optional-dependencies]
engine = [
	"pydantic-settings>=2",
	"watchfiles",
]
cli = [
	"beautifulsoup4",
	"dublib[validators]",
	"gnureadline>=8.3.3; sys_platform == \"linux\"",
	"pyreadline3; sys_platform == \"win32\"",
	"rich>=15"
]
requestor = [
	"curl_cffi>=0.16",
	"ua-generator>=2.1.3",
	"httpx",
	"httpx[http2]",
	"requests",
	"PyJWT",
]
validators = [
	"dateparser>=1.4",
	"packaging",
	"pathvalidate",
	"pydantic>=2",
	"validators>=0.36",
]

[dependency-groups]
dev = [
	"pytest",
	"ruff",
	"ty",
]
docs = [
	"commonmark",
	"myst_parser",
	"Sphinx",
	"sphinx-rtd-theme"
]

[project.urls]
Documentation = "https://dublib.readthedocs.io/"
"Source Code" = "https://github.com/DUB1401/dublib"
"Bug Tracker" = "https://github.com/DUB1401/dublib/issues"
Changelog = "https://github.com/DUB1401/dublib/releases"
