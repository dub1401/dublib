name: Ruff

permissions:
  contents: read

on:
  push:
    paths:
      - src/**
      - ruff.toml
  pull_request:
    paths:
      - src/**
      - ruff.toml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ruff
        run: uv run ruff check .
