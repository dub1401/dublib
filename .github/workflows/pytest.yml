name: pytest

permissions:
  contents: read

on:
  push:
    paths:
      - "src/dublib/functions/data/**"
      - "src/dublib/polyglot/**"
      - "src/dublib/validators/**"
      - "tests/**"
  pull_request:
    paths:
      - "src/dublib/functions/data/**"
      - "src/dublib/polyglot/**"
      - "src/dublib/validators/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run tests
        run: uv run pytest -v
