name: pytest

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "src/dublib/Engine/Bus.py"
      - "src/dublib/Functions/Data.py"
      - "src/dublib/Polyglot/**"
      - "tests/**"
  pull_request:
    paths:
      - "src/dublib/Engine/Bus.py"
      - "src/dublib/Functions/Data.py"
      - "src/dublib/Polyglot/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -v
